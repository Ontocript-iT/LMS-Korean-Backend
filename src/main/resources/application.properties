spring.application.name=backend

spring.datasource.url=${db_url}
spring.datasource.username=${db_username}
spring.datasource.password=${db_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

#server.port=8081

jwt.secret=${jwt_secret}
jwt.expiration=${jwt_expiration_milliseconds}

# Email Configuration (Sender.net SMTP)
#spring.mail.host=smtp.sender.net
#spring.mail.port=587
#spring.mail.username=your-sender-email@domain.com
#spring.mail.password=your-sender-api-key
#spring.mail.properties.mail.smtp.auth=true
#spring.mail.properties.mail.smtp.starttls.enable=true


# Brevo SMTP Configuration
spring.mail.host=${mail_host}
spring.mail.port=${mail_port}
spring.mail.username=${mail_username}
spring.mail.password=${mail_password}

# TLS and authentication (required)
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.transport.protocol=smtp
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Your sender email (keep your existing value)
app.sender.email=contact@ontocriptit.com

# Bunny.net Configuration
bunny.stream.library-id=${bunnynet_stream_library_id}
bunny.stream.api-key=${bunnynet_stream_api_key}
bunny.stream.cdn-hostname=${bunnynet_stream_cdn_hostname}
bunny.stream.security-key=${bunnynet_stream_security_key}
bunny.stream.max-videos-per-month=3

# File Upload Configuration - Increase limits for video files
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=1GB
spring.servlet.multipart.max-request-size=1GB
spring.servlet.multipart.file-size-threshold=10MB

# Connection timeout for large uploads
server.connection-timeout=600000
spring.mvc.async.request-timeout=600000

# WhatsApp Configuration
whatsapp.teacher.number=${whatsapp_teacher_number}


# Application URL
#app.base-url=http://localhost:8081

app.base-url=${app_base_url}
app.base-url=http://188.166.236.42:8080

